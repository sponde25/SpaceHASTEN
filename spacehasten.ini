[General]
SCHEDULER = slurm
PREPARE_ANACONDA = source /data/programs/oce/actoce
ACTIVATE_CHEMPROP = conda activate chemprop-2.1.2
ACTIVATE_CLUSTERING = conda activate fpsim2-0.7.3
GPU_EXCLUSIVE = 1
CPU_COUNT_SEARCH = 2
CPU_COUNT_DOCK = 1
CPU_COUNT_PREDICT = 1
CPU_COUNT_CONTROL = 1
CPU_COUNT_CLUSTERING = 64

[Paths]
EXE_SPACELIGHT_DEFAULT = /data/programs/BiosolveIT/spacelight-2.0.0-Linux-x64/spacelight
EXE_FTREES_DEFAULT = /data/programs/BiosolveIT/ftrees-7.0.0-Linux-x64/ftrees
SPACES_DIR_DEFAULT = /data/programs/BiosolveIT/spaces_new
SPACES_FILE_DEFAULT = /data/programs/BiosolveIT/spaces_new/REALSpace_83bn_2025-09.space
SCRATCH_DEFAULT = /wrk
SEEDS_DIR_DEFAULT = /data/programs/BiosolveIT/spaces_seeds
SEEDS_FILE_DEFAULT = /data/programs/BiosolveIT/spaces_seeds/Enamine_Diverse_REAL_drug-like_48.2M_cxsmiles.cxsmiles.bz2
EXPORT_POSES_SCRIPT = /data/lurvas/projects/coding/SpaceHASTEN/legacy/export_poses.py

[Slurm]
SLURM_PARTITION = jobs
SLURM_GPU_PARAMETER = --gpus=1

[SGE]
SGE_QUEUE = jobs
SGE_PE = smp
SGE_GPU_PARAMETER = -l gpu=1

[Properties]
MW_MIN = 0.0
MW_MAX = 500.0
SLOGP_MIN = -10.0
SLOGP_MAX = 5.0
HBA_MIN = 0
HBA_MAX = 10
HBD_MIN = 0
HBD_MAX = 5
ROTBONDS_MIN = 0
ROTBONDS_MAX = 10
TPSA_MIN = 0.0
TPSA_MAX = 140.0
