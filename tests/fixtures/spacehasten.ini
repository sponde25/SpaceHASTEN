[General]
scheduler = slurm
prepare_anaconda = source /data/programs/oce/actoce
activate_chemprop = conda activate chemprop-2.1.2
activate_clustering = conda activate fpsim2-0.7.3
gpu_exclusive = 1
cpu_count_search = 4
cpu_count_dock = 2
cpu_count_predict = 1
cpu_count_control = 1
cpu_count_clustering = 64
train_batch_size = 128
train_epochs = 25
train_final_lr = 5e-5
pred_batch_size = 64
pred_accelerator = gpu

[Paths]
exe_spacelight_default = /data/programs/BiosolveIT/spacelight-1.5.0-Linux-x64/spacelight
exe_ftrees_default = /data/programs/BiosolveIT/ftrees-6.13.0-Linux-x64/ftrees
scratch_default = /wrk
spaces_dir_default = /data/programs/BiosolveIT/spaces
spaces_file_default = /data/programs/BiosolveIT/spaces/REALSpace_70bn_2024-09.space
seeds_dir_default = /data/programs/BiosolveIT/spaces_seeds
seeds_file_default = /data/programs/BiosolveIT/spaces_seeds/Enamine_Diverse_REAL_drug-like_48.2M_cxsmiles.cxsmiles.bz2

[Slurm]
slurm_partition = jobs
slurm_gpu_parameter = --gres=gpu:1

[SGE]
sge_queue = all.q
sge_pe = smp
sge_gpu_parameter = -l gpu=1

[Properties]
mw_min = 0.0
mw_max = 500.0
slogp_min = -10.0
slogp_max = 5.0
hba_min = 0
hba_max = 10
hbd_min = 0
hbd_max = 5
rotbonds_min = 0
rotbonds_max = 10
tpsa_min = 0.0
tpsa_max = 140.0
